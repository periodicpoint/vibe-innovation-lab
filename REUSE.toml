# title: 'Licence map for the repository'
# author: 'Martin Maga (M.A.)'
# date: '2026-11-06'
# created: '2026-11-06T00:00:00+01:00'
# lang: 'en'
#
# REUSE specification 3.3 (https://reuse.software). Every file is covered by
# one effective annotation below, so no per-file headers are needed. The full
# licence texts live in LICENSES/. Code and configuration default to
# AGPL-3.0-or-later, prose and documentation to CC BY-SA 4.0. Grants cover
# only rights Martin Maga is entitled to grant. Separately applicable licences
# and statutory exceptions remain unaffected. A single star matches within one
# path segment, a double star crosses directories. When two annotations cover
# the same path, the later one wins. The repository carried an MIT grant until
# 2026-11-06, which remains valid for copies distributed under it.
# Validate with `reuse lint`, for example through
# `uv run --with 'reuse[charset-normalizer]' reuse lint`.
version = 1
SPDX-PackageName = "vibe-innovation-lab"
SPDX-PackageSupplier = "Martin Maga (M.A.) <contact@martinmaga.com>"
SPDX-PackageDownloadLocation = "https://github.com/periodicpoint/vibe-innovation-lab"

# Code and configuration: AGPL-3.0-or-later. This covers the Python sources,
# the JSON manifests, schemas, and Claude Code settings, the mise and
# Streamlit configuration, the lock file, the requirement lists, the
# devcontainer, the GitHub workflow, and the placeholder files that keep
# input/ and output/ in git. The directory globs also take files of types not
# listed, and the prose annotation below wins for the markdown inside them.
[[annotations]]
path = [
  "*.py", "**/*.py", "*.json", "**/*.json", "*.toml", "**/*.toml",
  "*.lock", "**/*.lock", "*.sh", "**/*.sh", "*.yml", "**/*.yml", "*.yaml", "**/*.yaml",
  "requirements.txt", "**/requirements.txt", ".gitignore", "**/.gitkeep",
  ".devcontainer/**", ".github/**", "scripts/**", "prototype/**",
]
SPDX-FileCopyrightText = "2026 Martin Maga (M.A.)"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Prose and documentation: CC BY-SA 4.0. This covers the framework texts in
# .claude/docs/, the skills, agents, commands, and rules, CLAUDE.md, every
# README.md, and the markdown in prototype/ and plugins/.
[[annotations]]
path = ["*.md", "**/*.md"]
SPDX-FileCopyrightText = "2026 Martin Maga (M.A.)"
SPDX-License-Identifier = "CC-BY-SA-4.0"
